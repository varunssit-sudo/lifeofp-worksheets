<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life of P Worksheets</title>
<meta name="description" content="Printable Standard 2 (ICSE) worksheets for every Life of P video: Maths, English and Science.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css?v=82069e84">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="logo" href="#">Life of <span>P</span> <small>Worksheets</small></a>
    <label class="search" for="search">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search: “past tense”, “table of 4”, “plants”" autocomplete="off">
    </label>
    <span class="grade">Standard 2 · ICSE</span>
    <a class="btn btn-ghost top-progress" href="#progress"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>My progress</a>
    <a class="btn btn-sub" href="https://www.youtube.com/@lifeofp5750?sub_confirmation=1" target="_blank" rel="noopener"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Subscribe</a>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite"></main>

<div id="preview" class="preview" hidden>
  <div class="preview-bar">
    <strong id="preview-title"></strong>
    <div class="preview-actions">
      <label class="switch"><input type="checkbox" id="preview-key"> Answer key</label>
      <button type="button" class="btn btn-print" id="preview-print">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>Print</button>
      <button type="button" class="btn btn-ghost" id="preview-close">Close</button>
    </div>
  </div>
  <div class="preview-body" id="preview-body"></div>
</div>

<div id="print-area" class="print-area" aria-hidden="true"></div>

<footer class="foot wrap">Made for Standard 2 learners · Videos on the <a href="https://www.youtube.com/@lifeofp5750" target="_blank" rel="noopener">Life of P YouTube channel</a> · <a href="#request">Ask for a worksheet or video</a></footer>
<script src="assets/app.js?v=48def128"></script>
</body>
</html>
